<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DuoSync 1.0.5</title><link rel="stylesheet" href="studio.css"></head>
<body>
<header><div class="brand"><img src="icons/icon48.png" alt=""><h1>DuoSync <span>1.0.5</span></h1></div><div class="headerActions"><button id="refresh" class="iconButton" title="Atualizar lista de abas" aria-label="Atualizar abas"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 12-2L20 12M4 12l2.5 5a7 7 0 0 0 12-2"/></svg></button></div></header>
<section class="settings">
<label>Base video<select id="baseTab"></select></label><label>Overlay video<select id="overlayTab"></select></label>
<div class="buttonGroup"><button id="direct">Direct video</button><button id="start" class="secondary">Capture tabs</button><button id="stop" class="secondary" disabled title="Stop capture"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button></div>
<button id="syncNow" class="secondary" disabled>Sync</button>
<label>Base time (mm:ss)<input id="baseSyncTime" type="text" inputmode="numeric" placeholder="2:20" value="0:00"></label><label>Overlay time (mm:ss)<input id="overlaySyncTime" type="text" inputmode="numeric" placeholder="4:43" value="0:00"></label>
<label class="check"><input id="keepSynced" type="checkbox" checked> Keep synchronized</label><label class="check"><input id="showOverlay" type="checkbox" checked> Show overlay</label><label class="check"><input id="muteOverlay" type="checkbox"> Mute overlay audio</label>
<label>Episode fit<select id="fitMode"><option value="contain">Contain (no crop)</option><option value="cover" selected>Fill area (crop edges)</option><option value="fill">Stretch to fill</option></select></label>
<button id="fullscreen" class="secondary" type="button"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg><span>Fullscreen</span></button>
<div class="volumeControl"><label for="baseVolume">Base volume</label><input id="baseVolume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Base volume"></div><div class="volumeControl"><label for="overlayVolume">Overlay volume</label><input id="overlayVolume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Overlay volume"></div><div class="volumeControl"><label for="overlayOpacity">Overlay opacity</label><input id="overlayOpacity" type="range" min="0" max="1" step="0.05" value="1" aria-label="Overlay opacity"></div>
</section>
<main id="stage"><div id="empty">Select two tabs with videos. Try <strong>Direct video</strong>; if that does not work, use <strong>Capture tabs</strong>.</div><video id="baseVideo" autoplay playsinline></video><div id="centerFeedback" aria-hidden="true"></div><div id="overlayBox"><video id="overlayVideo" autoplay playsinline title="Drag to reposition"></video><div id="resizeHandle" title="Redimensionar"></div></div>
<div id="playerControls" class="playerControls" aria-label="Video controls"><button id="seekBack" class="playerIcon" title="Go back 10 seconds (J)" aria-label="Go back 10 seconds"><svg viewBox="0 0 24 24"><path d="M4 5v5h5M5 10a8 8 0 1 1-1 5"/><text x="12" y="16" text-anchor="middle" font-size="7" stroke="none" fill="currentColor">10</text></svg></button><button id="playerPlay" class="playerIcon playIcon" title="Play or pause (K / Space)" aria-label="Play or pause"><svg id="playGlyph" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg><svg id="pauseGlyph" viewBox="0 0 24 24" hidden><path d="M7 5h4v14H7zM15 5h4v14h-4z"/></svg></button><button id="seekForward" class="playerIcon" title="Go forward 10 seconds (L)" aria-label="Go forward 10 seconds"><svg viewBox="0 0 24 24"><path d="M20 5v5h-5M19 10a8 8 0 1 0 1 5"/><text x="12" y="16" text-anchor="middle" font-size="7" stroke="none" fill="currentColor">10</text></svg></button><span class="controlSpacer"></span><div class="gearWrap"><button id="settingsToggle" class="playerIcon" title="Playback settings" aria-label="Playback settings" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1 1.1.9-1.1 2-1.4-.5a7.8 7.8 0 0 1-1.4.8l-.3 1.5h-2.3l-.3-1.5a7.8 7.8 0 0 1-1.5-.8l-1.3.5-1.2-2 1.2-.9a7 7 0 0 1 0-1.7l-1.2-.9 1.2-2 1.3.5a7.8 7.8 0 0 1 1.5-.8l.3-1.5h2.3l.3 1.5a7.8 7.8 0 0 1 1.4.8l1.4-.5 1.1 2-1.1.9a7 7 0 0 1 0 1.6Z" transform="translate(-1 -1) scale(1.08)"/></svg></button><div id="settingsMenu" class="settingsMenu" hidden><label>Speed<select id="speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1">Normal (1×)</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option><option value="4">4×</option></select></label><label>Episode fit<select id="fitModeMenu"><option value="contain">Contain (no crop)</option><option value="cover" selected>Fill area</option><option value="fill">Stretch to fill</option></select></label><p>Hold Space for temporary 2× speed</p></div></div><span id="controlSpeedLabel">1×</span><button id="exitFullscreen" class="playerIcon" title="Exit fullscreen" aria-label="Exit fullscreen"><svg viewBox="0 0 24 24"><path d="M9 3H3v6M15 3h6v6M3 15v6h6M21 15v6h-6"/></svg></button></div><div id="status" role="status" aria-live="polite"></div></main>
<script src="studio.js"></script></body></html>
